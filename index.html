<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixIt AI</title>
    <link rel="icon" type="image/png" href="logo3.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- السايدبار -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="logo.png" class="sidebar-logo" id="sidebarLogo">
            <button id="toggleSidebar" class="icon-btn close-btn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        </div>
        
        <div class="sidebar-tools">
            <button class="new-chat-btn" id="newChatBtn">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                محادثة جديدة
            </button>
            <button id="searchBtn" class="icon-btn search-icon-btn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        </div>

        <div id="pinnedChatsSection" style="display: none; width: 100%; margin-top: 10px; flex-direction: column; gap: 8px;">
            <div style="color: #888; font-size: 11px; font-weight: bold; padding-right: 5px; margin-bottom: 5px;">المحادثات المثبتة</div>
            <div id="pinnedChatHistory" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;"></div>
        </div>

        <div id="chatHistory" class="chat-history-scroll"></div>

        <button id="sidebarScrollBtn" class="scroll-btn-sidebar hidden">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="var(--accent)" stroke-width="2" fill="none"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </button>

        <div class="user-profile">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=U&background=00b894&color=fff" class="avatar" alt="User">
                <span id="sidebarUserName" class="username">مستخدم</span>
            </div>
            <button onclick="logout()" class="logout-btn">خروج</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <!-- زرار السايدبار العايم (على الكمبيوتر بس) -->
        <button id="openSidebarBtn" class="floating-sidebar-btn">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>

        <!-- الشريط العلوي -->
        <div class="chat-header-bar" id="chatHeaderBar">
            <img src="logo2.png" class="top-logo desktop-only" id="topLogo">
            
            <!-- الشايب اللي فيه الزراير (للكمبيوتر) -->
            <div class="top-shortcuts desktop-only">
                <button id="sidebarBtnTop" class="icon-btn"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
                <button id="searchBtnTop" class="icon-btn"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
                <button id="newChatBtnTop" class="icon-btn"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
            </div>

            <span id="headerChatTitle" class="header-chat-title" onclick="editChatTitleFromHeader()">محادثة جديدة</span>

            <!-- زرار السايدبار للموبايل -->
            <button id="mobileSidebarBtn" class="icon-btn mobile-only"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>

            <!-- أزرار الموبايل -->
            <div class="top-actions-mobile mobile-only">
                <button id="searchBtnMobile" class="icon-btn"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
                <button id="newChatBtnMobile" class="icon-btn"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
            </div>
        </div>

        <div class="welcome-logo" id="welcomeLogo">
            <div class="logo-container">
                <img src="logo.png" class="main-logo">
                <div class="brand-right"><span>by</span><img src="naghi-logo.png" class="naghi-logo"></div>
            </div>
            <h1 class="welcome-text">مرحباً، ما المشكلة في منزلك اليوم؟</h1>
        </div>
        
        <main class="chat-container" id="chatContainer"></main>
        
        <button id="scrollToBottomBtn" class="scroll-btn hidden">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="var(--accent)" stroke-width="2" fill="none"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </button>

        <div class="input-area">
            <div id="previewContainer" class="preview-container"></div>
            <div class="input-box">
                <button id="attachBtn" class="icon-btn attach-btn"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                <textarea id="problemText" rows="1" placeholder="اكتب مشكلتك هنا..."></textarea>
                <button id="btnDiagnose" class="send-btn"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
                <div id="attachmentMenu" class="attachment-menu">
                    <button class="attach-option" onclick="triggerInput('camera')">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="var(--accent)" stroke-width="2" fill="none" style="margin-bottom: 5px;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        كاميرا
                    </button>
                    <button class="attach-option" onclick="triggerInput('image')">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="var(--accent)" stroke-width="2" fill="none" style="margin-bottom: 5px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        صورة
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة إعادة التسمية -->
    <div id="renameModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p style="margin-bottom: 20px; font-size: 18px;">تغيير اسم المحادثة</p>
            <input type="text" id="renameInput" placeholder="أدخل الاسم الجديد" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white; margin-bottom: 20px; outline: none; font-family: 'Cairo';">
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button onclick="submitRename()" class="btn-primary">حفظ</button>
                <button onclick="closeRenameModal()" class="btn-cancel">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة البحث -->
    <div id="searchModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p style="margin-bottom: 20px; font-size: 18px;">البحث في المحادثة</p>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="searchInputModal" placeholder="اكتب كلمة للبحث..." style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white; outline: none; font-family: 'Cairo';">
                <button onclick="executeSearch()" class="icon-btn"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
            </div>
            <div style="display: flex; justify-content: center;">
                <button onclick="closeSearchModal()" class="btn-cancel">إغلاق</button>
            </div>
        </div>
    </div>

    <div id="imageLightbox" class="lightbox" onclick="closeLightbox()">
        <button class="close-lightbox" onclick="closeLightbox(event)">×</button>
        <img id="lightboxImg" src="" alt="Fullscreen Image" onclick="event.stopPropagation()">
    </div>

    <!-- نافذة الحذف -->
    <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p style="margin-bottom: 20px; font-size: 18px;">هل أنت متأكد أنك تريد حذف هذه المحادثة؟</p>
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button onclick="confirmDelete()" class="btn-danger">نعم، احذف</button>
                <button onclick="closeModal()" class="btn-cancel">إلغاء</button>
            </div>
        </div>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="imageInput" accept="image/*" style="display: none;">

    <script type="module" src="script.js"></script>
</body>
</html>
