<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixIt AI</title>
    <link rel="icon" type="image/png" href="logo3.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="logo2.png" class="sidebar-logo">
            <button id="toggleSidebar" class="icon-btn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        </div>
        
        <div class="sidebar-actions">
            <button class="icon-btn" id="searchBtn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
            <button class="icon-btn" id="newChatBtn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
        <div id="searchContainer" class="hidden"><input type="text" id="searchInput" placeholder="ابحث..."></div>

        <div id="pinnedChatsSection" style="display: none; width: 100%; margin-top: 10px; flex-direction: column; gap: 8px;">
            <div style="color: #888; font-size: 11px; font-weight: bold; padding-right: 5px; margin-bottom: 5px;">المحادثات المثبتة</div>
            <div id="pinnedChatHistory" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;"></div>
        </div>

        <div id="chatHistory" style="width: 100%; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; padding-right: 5px;"></div>

        <div class="user-profile" style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 15px; border-top: 1px solid var(--glass-border); width: 100%;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=U&background=00b894&color=fff" style="width: 35px; height: 35px; border-radius: 50%;" alt="User">
                <span id="sidebarUserName" style="font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px;">مستخدم</span>
            </div>
            <button onclick="logout()" style="background:transparent; border:none; color:#ff6b6b; cursor:pointer; font-family:'Cairo'; font-size:12px;">خروج</button>
        </div>
    </div>

    <div class="main-content">
        <div class="welcome-logo" id="welcomeLogo">
            <div class="logo-container">
                <img src="logo.png" class="main-logo">
                <div class="brand-right"><span>by</span><img src="naghi-logo.png" class="naghi-logo"></div>
            </div>
            <h1 class="welcome-text">مرحباً، ما المشكلة في منزلك اليوم؟</h1>
        </div>
        <main class="chat-container" id="chatContainer"></main>
        
        <div class="input-area">
            <!-- خانة المرفقات اللي فوق الرسائل -->
            <div id="previewContainer" class="preview-container"></div>

            <div class="input-box">
                <button id="attachBtn" class="icon-btn attach-btn" style="border: none; padding: 5px;">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                
                <textarea id="problemText" rows="1" placeholder="اكتب مشكلتك هنا..."></textarea>
                
                <button id="btnDiagnose" class="send-btn"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>

                <div id="attachmentMenu" class="attachment-menu">
                    <button class="attach-option" onclick="triggerInput('camera')">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="var(--accent)" stroke-width="2" fill="none" style="margin-bottom: 5px;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        كاميرا
                    </button>
                    <button class="attach-option" onclick="triggerInput('image')">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="var(--accent)" stroke-width="2" fill="none" style="margin-bottom: 5px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        صورة
                    </button>
                    <button class="attach-option" onclick="triggerInput('file')">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="var(--accent)" stroke-width="2" fill="none" style="margin-bottom: 5px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                        مستند
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="deleteModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #1e1e1e; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid var(--glass-border); color: white;">
            <p style="margin-bottom: 20px; font-size: 18px;">هل أنت متأكد أنك تريد حذف هذه المحادثة؟</p>
            <button onclick="confirmDelete()" style="background: #ff4757; color: white; border: none; padding: 10px 20px; border-radius: 8px; margin-left: 10px; cursor: pointer; font-family: 'Cairo';">نعم، احذف</button>
            <button onclick="closeModal()" style="background: transparent; color: white; border: 1px solid var(--glass-border); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: 'Cairo';">إلغاء</button>
        </div>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="imageInput" accept="image/*" style="display: none;">
    <input type="file" id="fileInput" style="display: none;">

    <script src="groq-ai.js"></script>
    <script src="script.js"></script>
</body>
</html>
