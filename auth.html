<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - FixIt AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0a0a0a; --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --accent: #00b894; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-dark); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .auth-container { width: 100%; max-width: 400px; padding: 30px; background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .auth-container h2 { text-align: center; margin-bottom: 20px; font-size: 24px; }
        
        .google-btn { width: 100%; padding: 12px; background: white; color: #333; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .divider { text-align: center; margin: 15px 0; color: #888; font-size: 14px; position: relative; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #333; }
        .divider::before { right: 0; }
        .divider::after { left: 0; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        .input-group input { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); border-radius: 10px; color: white; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: var(--accent); }
        
        .strength-meter { height: 4px; width: 0%; background: red; margin-top: 8px; border-radius: 2px; transition: 0.3s; }
        .req-text { font-size: 11px; color: #888; margin-top: 5px; }
        
        .auth-btn { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .auth-btn:hover { background: #00a382; }
        
        .toggle-text { text-align: center; margin-top: 15px; font-size: 14px; color: #888; cursor: pointer; }
        .toggle-text span { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div id="loginSection">
            <h2>تسجيل الدخول</h2>
            <button class="google-btn" onclick="window.location.href='index.html'">
                <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                المتابعة باستخدام Google
            </button>
            <div class="divider">أو</div>
            <div class="input-group">
                <label>الإيميل</label>
                <input type="email" placeholder="example@email.com">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="********">
            </div>
            <button class="auth-btn" onclick="login()">دخول</button>
            <p class="toggle-text" onclick="toggleForms()">معندكش حساب؟ <span>اعمل حساب جديد</span></p>
        </div>

        <div id="signupSection" style="display: none;">
            <h2>إنشاء حساب جديد</h2>
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="اكتب اسمك">
            </div>
            <div class="input-group">
                <label>الإيميل</label>
                <input type="email" id="email" placeholder="example@email.com">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="********" oninput="checkStrength()">
                <div class="strength-meter" id="strengthMeter"></div>
                <div class="req-text">لازم تحتوي على: 8 حروف، كابيتال، سمول، رقم، ورمز (!@#$)</div>
            </div>
            <div class="input-group">
                <label>تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword" placeholder="********">
            </div>
            <button class="auth-btn" onclick="signup()">تسجيل</button>
            <p class="toggle-text" onclick="toggleForms()">عندك حساب؟ <span>سجل دخول</span></p>
        </div>
    </div>

    <script>
        function toggleForms() {
            var login = document.getElementById("loginSection");
            var signup = document.getElementById("signupSection");
            if (login.style.display === "none") {
                login.style.display = "block";
                signup.style.display = "none";
            } else {
                login.style.display = "none";
                signup.style.display = "block";
            }
        }

        function checkStrength() {
            var pwd = document.getElementById("password").value;
            var meter = document.getElementById("strengthMeter");
            var strength = 0;
            
            if (pwd.length >= 8) strength += 25;
            if (pwd.match(/[A-Z]/)) strength += 25;
            if (pwd.match(/[a-z]/)) strength += 25;
            if (pwd.match(/[0-9]/) && pwd.match(/[^A-Za-z0-9]/)) strength += 25;

            meter.style.width = strength + "%";
            if (strength <= 25) meter.style.background = "red";
            else if (strength <= 50) meter.style.background = "orange";
            else if (strength <= 75) meter.style.background = "yellow";
            else meter.style.background = "#00b894"; 
        }

        function login() {
            localStorage.setItem("userName", "زائر");
            window.location.href = "index.html";
        }

        function signup() {
            var pwd = document.getElementById("password").value;
            var confirmPwd = document.getElementById("confirmPassword").value;
            var username = document.getElementById("username").value;
            
            if (!username) { alert("اكتب اسم المستخدم الأول!"); return; }
            if (pwd !== confirmPwd) { alert("كلمتين المرور مش متطابقين!"); return; }
            if (pwd.length < 8) { alert("كلمة المرور قصيرة جداً!"); return; }
            
            localStorage.setItem("userName", username);
            localStorage.setItem("userEmail", document.getElementById("email").value);
            
            alert("تم إنشاء الحساب بنجاح!");
            window.location.href = "index.html"; 
        }
    </script>
</body>
</html>
