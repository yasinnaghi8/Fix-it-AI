<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - FixIt AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0a0a0a; --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --accent: #00b894; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-dark); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        
        .logo-top { margin-bottom: 20px; }
        .logo-top img { width: 80px; }

        .auth-container { width: 100%; max-width: 400px; padding: 30px; background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .auth-container h2 { text-align: center; margin-bottom: 20px; font-size: 24px; }
        
        .google-btn { width: 100%; padding: 12px; background: white; color: #333; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .google-btn img { width: 20px; }
        
        .divider { text-align: center; margin: 15px 0; color: #888; font-size: 14px; position: relative; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #333; }
        .divider::before { right: 0; }
        .divider::after { left: 0; }
        
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); border-radius: 10px; color: white; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: var(--accent); }
        
        .auth-btn { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .auth-btn:hover { background: #00a382; }
        
        .toggle-text { text-align: center; margin-top: 15px; font-size: 14px; color: #888; cursor: pointer; }
        .toggle-text span { color: var(--accent); font-weight: bold; }
        .forgot-pass { text-align: center; margin-top: 10px; font-size: 13px; color: #ff6b6b; cursor: pointer; }
        .error-msg { color: #ff6b6b; text-align: center; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="logo-top">
        <img src="logo2.png" alt="FixIt AI Logo">
    </div>

    <div class="auth-container">
        <!-- تسجيل الدخول -->
        <div id="loginSection">
            <h2>تسجيل الدخول</h2>
            <button class="google-btn" onclick="signInWithGoogle()">
                <img src="google.png" alt="Google">
                المتابعة باستخدام Google
            </button>
            <div class="divider">أو</div>
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="كلمة المرور">
            </div>
            <button class="auth-btn" onclick="loginEmail()">دخول</button>
            <p class="forgot-pass" onclick="resetPassword()">هل نسيت كلمة المرور؟</p>
            <p class="toggle-text" onclick="toggleForms()">معندكش حساب؟ <span>اعمل حساب جديد</span></p>
            <p class="error-msg" id="loginError"></p>
        </div>

        <!-- إنشاء حساب -->
        <div id="signupSection" style="display: none;">
            <h2>إنشاء حساب جديد</h2>
            <div class="input-group">
                <input type="text" id="signupName" placeholder="اسم المستخدم">
            </div>
            <div class="input-group">
                <input type="email" id="signupEmail" placeholder="البريد الإلكتروني">
            </div>
            <div class="input-group">
                <input type="password" id="signupPassword" placeholder="كلمة المرور (8 حروف على الأقل)">
            </div>
            <div class="input-group">
                <input type="password" id="signupConfirmPassword" placeholder="تأكيد كلمة المرور">
            </div>
            <button class="auth-btn" onclick="signupEmail()">تسجيل</button>
            <p class="toggle-text" onclick="toggleForms()">عندك حساب؟ <span>سجل دخول</span></p>
            <p class="error-msg" id="signupError"></p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ⚠️ ضع كود firebaseConfig بتاعك هنا ⚠️
        const firebaseConfig = {
  apiKey: "AIzaSyDLxCa6EcOu_jCoB4f0wyq-gFSiudehgPM",
  authDomain: "fixit-ai-naghi.firebaseapp.com",
  projectId: "fixit-ai-naghi",
  storageBucket: "fixit-ai-naghi.firebasestorage.app",
  messagingSenderId: "581173241560",
  appId: "1:581173241560:web:c9a2983be8245e323799ad",
  measurementId: "G-7ZRKL2RQ6F"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.toggleForms = function() {
            var login = document.getElementById("loginSection");
            var signup = document.getElementById("signupSection");
            login.style.display = login.style.display === "none" ? "block" : "none";
            signup.style.display = signup.style.display === "none" ? "block" : "none";
        }

        window.signInWithGoogle = function() {
    signInWithPopup(auth, provider).then((result) => {
        localStorage.setItem("userName", result.user.displayName || "مستخدم");
        // السطر ده هو اللي هيجيب صورة جوجل بتاعتك
        if (result.user.photoURL) {
            localStorage.setItem("userAvatar", result.user.photoURL);
        } else {
            localStorage.removeItem("userAvatar");
        }
        window.location.href = "index.html";
    }).catch((error) => {
        document.getElementById("loginError").style.display = "block";
        document.getElementById("loginError").innerText = error.message;
    });
}

        window.signupEmail = function() {
            const name = document.getElementById("signupName").value;
            const email = document.getElementById("signupEmail").value;
            const password = document.getElementById("signupPassword").value;
            const confirm = document.getElementById("signupConfirmPassword").value;

            if(password !== confirm) {
                document.getElementById("signupError").style.display = "block";
                document.getElementById("signupError").innerText = "كلمتين المرور غير متطابقتين";
                return;
            }

            createUserWithEmailAndPassword(auth, email, password).then((userCredential) => {
                updateProfile(userCredential.user, { displayName: name }).then(() => {
                    localStorage.setItem("userName", name);
                    window.location.href = "index.html";
                });
            }).catch((error) => {
                document.getElementById("signupError").style.display = "block";
                document.getElementById("signupError").innerText = error.message;
            });
        }

        window.loginEmail = function() {
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            signInWithEmailAndPassword(auth, email, password).then((userCredential) => {
                localStorage.setItem("userName", userCredential.user.displayName || "مستخدم");
                window.location.href = "index.html";
            }).catch((error) => {
                document.getElementById("loginError").style.display = "block";
                document.getElementById("loginError").innerText = "الإيميل أو الباسورد غلط";
            });
        }

        window.resetPassword = function() {
            const email = document.getElementById("loginEmail").value;
            if(!email) { alert("اكتب إيميلك الأول عشان نبعتلك اللينك"); return; }
            sendPasswordResetEmail(auth, email).then(() => {
                alert("تم إرسال لينك إعادة تعيين كلمة المرور على إيميلك!");
            }).catch((error) => {
                alert("خطأ: " + error.message);
            });
        }
    </script>
</body>
</html>
